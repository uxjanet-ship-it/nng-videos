<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NN/g Video Feed</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --line:#e3e3de; --accent:#2457d6; --chip:#eef2fd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --card:#212121; --text:#eee; --muted:#9a9a94; --line:#333; --accent:#7ea3ff; --chip:#26304a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { font-size:1.5rem; margin:0; }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:8px 16px; border-radius:8px; }
  button:disabled { opacity:.6; cursor:wait; }
  .status { color:var(--muted); font-size:.875rem; margin:8px 0 16px; min-height:1.3em; }
  .status.err { color:#c0392b; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .filters input[type=search] { flex:1 1 220px; font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); padding:4px 12px; border-radius:999px; font-size:.875rem; }
  .chip[aria-pressed=true] { background:var(--chip); border-color:var(--accent); color:var(--accent); }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  li a.t { color:var(--text); font-weight:600; text-decoration:none; }
  li a.t:hover { color:var(--accent); text-decoration:underline; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .sum { margin:6px 0 0; font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NN/g videos</h1>
    <button id="refresh">↻ Refresh from nngroup.com</button>
  </header>
  <div class="status" id="status" role="status"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search titles…" aria-label="Search titles">
    <span id="chips" style="display:contents"></span>
  </div>
  <ol id="list"></ol>
</div>
<script>
let data = null, active = new Set();
const $ = id => document.getElementById(id);
const fmt = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });

function render() {
  if (!data) return;
  const q = $('q').value.toLowerCase();
  const rows = data.videos.filter(v =>
    (!active.size || v.authors.some(a => active.has(a))) &&
    (!q || v.title.toLowerCase().includes(q)));
  $('list').replaceChildren(...rows.map(v => {
    const li = document.createElement('li');
    const a = Object.assign(document.createElement('a'), { className:'t', href:v.youtube || v.url, target:'_blank', rel:'noopener', textContent:v.title });
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = [fmt(v.date), v.minutes ? v.minutes + ' min' : null, v.authors.join(', ')].filter(Boolean).join(' · ');
    li.append(a, m);
    if (v.summary) { const p = document.createElement('p'); p.className = 'sum'; p.textContent = v.summary; li.append(p); }
    return li;
  }));
  if (!rows.length) $('list').innerHTML = '<li>No videos match.</li>';
}

function renderChips() {
  $('chips').replaceChildren(...data.authors.map(name => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = name; b.setAttribute('aria-pressed', active.has(name));
    b.onclick = () => { active.has(name) ? active.delete(name) : active.add(name); b.setAttribute('aria-pressed', active.has(name)); render(); };
    return b;
  }));
}

async function load(url = '/api/videos') {
  const btn = $('refresh'), st = $('status');
  btn.disabled = true; st.className = 'status'; st.textContent = 'Fetching from nngroup.com… (first run can take a minute)';
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    data = d; renderChips(); render();
    st.textContent = `${d.videos.length} videos from the selected authors (${d.scanned} NN/g videos scanned, ${d.new} new). Updated ${new Date().toLocaleTimeString('en-AU')}.`;
  } catch (e) {
    st.className = 'status err'; st.textContent = 'Could not refresh: ' + e.message;
  } finally { btn.disabled = false; }
}

$('refresh').onclick = () => load();
$('q').oninput = render;
load('/api/videos?cached=1').then(() => load());
</script>
</body>
</html>
